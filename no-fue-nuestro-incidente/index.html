<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio 02 · No fue nuestro incidente</title>
<meta name="description" content="Laboratorio interactivo de entrenamiento sobre responsables, encargados, remisiones, transferencias y subcontratación de datos personales en México. Caso ficticio.">
<style>
:root{
  --papel:#FAF8F4;--fondo:#F1F3F5;--sup:#FFFFFF;--tinta:#1B2430;--tinta-2:#4F5A69;
  --acento:#1F6F78;--acento-2:#E4F0F1;--acento-3:#17565D;
  --tension:#B7791F;--tension-bg:#FBF3E4;--tension-tx:#6A430D;
  --linea:#CBD2DA;--linea-2:#E3E7EC;--sello:#5E4590;
  --radio:10px;--sombra:0 1px 2px rgba(27,36,48,.06),0 2px 8px rgba(27,36,48,.05);
  --f-ui:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-doc:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f-ui);font-size:16px;line-height:1.5}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.45rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0 0 .75rem}
a{color:var(--acento-3)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;background:var(--sup);padding:.5rem 1rem;z-index:50}
.skip:focus{left:.5rem;top:.5rem}
code,.mono{font-family:var(--f-mono);font-size:.9em}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.55rem 1.1rem;border-radius:8px;border:1px solid var(--acento);background:var(--acento);color:#fff;font-weight:600;cursor:pointer;text-align:center}
.btn:hover{background:var(--acento-3)}
.btn.sec{background:var(--sup);color:var(--acento-3)}
.btn.sec:hover{background:var(--acento-2)}
.btn.ghost{background:transparent;border-color:var(--linea);color:var(--tinta);font-weight:500}
.btn.ghost:hover{background:var(--sup)}
.btn.small{min-height:36px;padding:.3rem .7rem;font-size:.9rem}
.linkbtn{background:none;border:none;padding:0;color:var(--acento-3);text-decoration:underline;cursor:pointer;min-height:32px}

/* Barra superior */
.topbar{position:sticky;top:0;z-index:20;background:var(--sup);border-bottom:1px solid var(--linea);display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.5rem 1rem}
.brand{display:flex;align-items:baseline;gap:.5rem;font-weight:600;white-space:nowrap}
.brand .lab{font-family:var(--f-mono);font-size:.8rem;color:var(--sup);background:var(--tinta);padding:.1rem .4rem;border-radius:4px}
.stepper ol{list-style:none;display:flex;gap:.25rem;margin:0;padding:0;flex-wrap:wrap}
.stepper button{min-height:40px;border:1px solid var(--linea);background:var(--sup);border-radius:999px;padding:.25rem .75rem;cursor:pointer;font-size:.9rem;color:var(--tinta)}
.stepper button[aria-current="step"]{border-color:var(--acento);background:var(--acento-2);color:var(--acento-3);font-weight:600}
.stepper button:disabled{color:#6B7684;background:var(--fondo);cursor:not-allowed}
.stepper .stt{display:inline}
.meta{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:.85rem;color:var(--tinta-2)}
.badge{display:inline-block;min-width:1.4rem;padding:0 .35rem;border-radius:999px;background:var(--acento);color:#fff;font-size:.75rem;font-weight:700;text-align:center}
.notice{background:var(--tension-bg);color:var(--tension-tx);border-bottom:1px solid var(--tension);padding:.4rem 1rem;font-size:.9rem}

/* Distribución */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;max-width:1500px;margin:0 auto;min-height:calc(100vh - 60px)}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.sidebar{border-right:1px solid var(--linea);background:var(--sup);padding:1rem .75rem;position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto}
.rightpanel{border-left:1px solid var(--linea);background:var(--sup);padding:1rem .9rem;position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto}
main{padding:1.25rem 1.5rem 3rem;min-width:0}
main:focus{outline:none}
@media (max-width:1150px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .rightpanel{position:static;max-height:none;border-left:none;border-top:1px solid var(--linea);padding:1rem 1.5rem}
}
@media (min-width:1151px){#btnExp{display:none}}

/* Expediente (lista de documentos) */
.doclist h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2);margin:.25rem 0 .5rem}
.doclist ul{list-style:none;margin:0 0 1rem;padding:0}
.doclist li{margin:0 0 .25rem}
.doclist button{width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:.45rem .5rem;cursor:pointer;display:flex;gap:.5rem;align-items:flex-start;min-height:44px;font-size:.9rem}
.doclist button:hover{background:var(--fondo);border-color:var(--linea-2)}
.doclist .k{font-family:var(--f-mono);font-size:.8rem;color:var(--sello);font-weight:600;padding-top:.1rem}
.doclist .nuevo{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--acento-3);border:1px solid var(--acento);border-radius:4px;padding:0 .3rem;white-space:nowrap}
.doclist .stage{font-size:.75rem;color:var(--tinta-2);margin:.4rem .5rem .2rem}

/* Encabezados de etapa y mensajes */
.stagehead{margin-bottom:1rem}
.eyebrow{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.04em;color:var(--tinta-2);margin:0 0 .25rem}
.lead{color:var(--tinta-2);max-width:62ch}
.msg{background:var(--sup);border:1px solid var(--linea);border-left:4px solid var(--acento);border-radius:var(--radio);padding:.9rem 1rem;margin:0 0 1rem;max-width:760px;box-shadow:var(--sombra)}
.msg .from{font-size:.85rem;color:var(--tinta-2);margin:0 0 .35rem}
.msg blockquote{margin:0;font-size:1rem}
.arrivals{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;background:var(--acento-2);border:1px solid #BFDADD;border-radius:var(--radio);padding:.6rem .8rem;margin:0 0 1rem;font-size:.9rem}
.card{background:var(--sup);border:1px solid var(--linea);border-radius:var(--radio);padding:1rem;box-shadow:var(--sombra);margin:0 0 1rem}
.card>h2,.card>h3{margin-bottom:.6rem}
.hint{font-size:.88rem;color:var(--tinta-2)}
.aviso{font-size:.92rem;color:var(--tension-tx);background:var(--tension-bg);border:1px solid var(--tension);border-radius:8px;padding:.5rem .7rem;margin:.5rem 0}
.aviso:empty{display:none}
.nota{font-size:.9rem;background:var(--fondo);border-radius:8px;padding:.5rem .7rem;margin:.5rem 0}
.continuar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--linea)}

/* Opciones (radios y casillas) */
fieldset{border:none;margin:0 0 1rem;padding:0;min-width:0}
legend{font-weight:600;margin-bottom:.4rem;padding:0;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.opts{display:flex;flex-wrap:wrap;gap:.45rem}
.opts.col{flex-direction:column;align-items:stretch}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt label{display:flex;align-items:center;gap:.5rem;min-height:44px;padding:.45rem .75rem;border:1px solid var(--linea);border-radius:8px;background:var(--sup);cursor:pointer;font-size:.95rem;line-height:1.35}
.opt label::before{content:"";flex:0 0 auto;width:14px;height:14px;border:2px solid #7A8593;border-radius:50%;background:#fff}
.opt input[type=checkbox]+label::before{border-radius:3px}
.opt input:checked+label{border-color:var(--acento);background:var(--acento-2)}
.opt input:checked+label::before{border-color:var(--acento);background:var(--acento);box-shadow:inset 0 0 0 2px #fff}
.opt input:focus-visible+label{outline:3px solid var(--acento);outline-offset:2px}
.opt input:disabled+label{opacity:.6;cursor:not-allowed;background:var(--fondo)}
.opt label:hover{border-color:var(--acento)}
select,input[type=text],textarea{width:100%;min-height:44px;border:1px solid #8A95A3;border-radius:8px;background:#fff;padding:.5rem .65rem}
textarea{min-height:8rem;resize:vertical;line-height:1.5}
label.lbl{display:block;font-weight:600;margin:0 0 .35rem}
.counter{font-size:.85rem;color:var(--tinta-2);margin-top:.3rem}
.counter.fuera{color:var(--tension-tx);font-weight:600}
details.help{display:inline-block;font-weight:400}
details.help summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--linea);font-size:.8rem;font-weight:700;color:var(--acento-3);background:var(--sup)}
details.help summary::-webkit-details-marker{display:none}
details.help[open] summary{background:var(--acento-2)}
details.help .helptx{display:block;font-size:.88rem;background:var(--papel);border:1px solid var(--linea);border-radius:8px;padding:.5rem .65rem;margin-top:.35rem;max-width:520px;color:var(--tinta)}
.helpline{display:block;width:100%}
details.helpline summary{width:auto;height:auto;min-height:36px;border:none;border-radius:0;background:none;justify-content:flex-start;padding:.15rem 0;font-weight:500;font-size:.88rem;text-decoration:underline;text-underline-offset:2px}
details.helpline[open] summary{background:none}

/* Mapa */
.mapwrap{background:var(--sup);border:1px solid var(--linea);border-radius:var(--radio);padding:.5rem;margin:0 0 1rem;box-shadow:var(--sombra)}
.mapwrap.small{max-width:720px}
.map-svg{display:block;width:100%;height:auto;max-height:560px}
.map-svg .box{fill:#fff;stroke:#9AA4B1;stroke-width:1.2}
.map-svg .box.dash{stroke-dasharray:5 4;fill:#FBFCFD}
.map-svg .inner{fill:var(--fondo);stroke:#C3CAD3;stroke-width:1}
.map-svg .inner.dash{stroke-dasharray:4 3;fill:#fff}
.map-svg .ttl{font:600 13px var(--f-ui);fill:var(--tinta)}
.map-svg .tx{font:400 11px var(--f-ui);fill:var(--tinta-2)}
.map-svg .rl{font:600 11px var(--f-ui);fill:var(--acento-3)}
.map-svg .rl.vacio{fill:#6B7684;font-weight:400;font-style:italic}
.map-svg .node{cursor:pointer}
.map-svg .node:focus{outline:none}
.map-svg .node:focus-visible .box{stroke:var(--acento);stroke-width:3.5}
.map-svg .node:hover .box{stroke:var(--acento)}
.map-svg .node.sel .box{stroke:var(--acento);stroke-width:3}
.map-svg .node.static{cursor:default}
.map-svg .fl path.ln{fill:none;stroke:#6B7684;stroke-width:1.8}
.map-svg .fl path.hit{fill:none;stroke:transparent;stroke-width:18}
.map-svg .fl circle{fill:#fff;stroke:#6B7684;stroke-width:1.5}
.map-svg .fl text{font:700 10px var(--f-mono);fill:var(--tinta);text-anchor:middle;dominant-baseline:central}
.map-svg .fl.set circle{fill:var(--acento-2);stroke:var(--acento)}
.map-svg .fl:not(.int){pointer-events:none}
.map-svg .fl.int{cursor:pointer}
.map-svg .fl.int:hover path.ln{stroke:var(--acento)}
.map-svg .fl.sel path.ln{stroke:var(--acento);stroke-width:3.2}
.map-svg .fl.sel circle{fill:var(--acento);stroke:var(--acento)}
.map-svg .fl.sel text{fill:#fff}
.map-svg .fl:focus{outline:none}
.map-svg .fl:focus-visible circle{stroke:var(--acento);stroke-width:3.5}
.map-svg .fl:focus-visible path.ln{stroke:var(--acento);stroke-width:3}
.map-tall{display:none}
@media (max-width:600px){.map-wide{display:none}.map-tall{display:block}}

/* E1–E2: actores */
.actores{display:grid;grid-template-columns:240px minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:820px){.actores{grid-template-columns:minmax(0,1fr)}}
.resumen{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.resumen button{width:100%;text-align:left;background:var(--sup);border:1px solid var(--linea);border-radius:8px;padding:.55rem .7rem;cursor:pointer;min-height:44px;display:block}
.resumen button[aria-current="true"]{border-color:var(--acento);box-shadow:inset 3px 0 0 var(--acento)}
.resumen .n{font-weight:600;display:block}
.resumen .r{font-size:.85rem;color:var(--tinta-2);display:block}
.resumen .st{font-size:.78rem;display:block;margin-top:.15rem;color:var(--tinta-2)}
.resumen .st.ok{color:var(--acento-3);font-weight:600}
.ficha{background:var(--sup);border:1px solid var(--linea);border-radius:var(--radio);padding:1rem 1.1rem;box-shadow:var(--sombra);min-width:0}
.ficha .fhead{border-bottom:1px solid var(--linea-2);margin-bottom:.9rem;padding-bottom:.6rem}
.ficha .razon{font-size:.85rem;color:var(--tinta-2);margin:0}
.ficha .para{margin:.35rem 0 0}
.ficha .etq{display:inline-block;margin-top:.5rem;font-size:.85rem;background:var(--papel);border:1px solid var(--linea);border-radius:6px;padding:.2rem .5rem}
.ficha .sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2);margin:1rem 0 .5rem;font-weight:700}
.ficha .derivado{background:var(--fondo);border-radius:8px;padding:.5rem .7rem;font-size:.93rem}
.subroles{border-left:3px solid var(--acento);padding:.25rem 0 .25rem .8rem;margin:.25rem 0 1rem}
.subroles fieldset{margin-bottom:.75rem}
.fichanav{display:flex;justify-content:space-between;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
.placeholder{color:var(--tinta-2);border:1px dashed var(--linea);border-radius:var(--radio);padding:1.25rem;text-align:center;background:var(--sup)}

/* E3: flujos */
.flujos{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem}
.flujo{background:var(--sup);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
.flujo.sel{border-color:var(--acento);box-shadow:0 0 0 1px var(--acento),var(--sombra)}
.flujo-head{width:100%;display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:.2rem .6rem;text-align:left;background:none;border:none;padding:.7rem .8rem;cursor:pointer;min-height:44px;border-radius:var(--radio)}
.flujo-head .fid{grid-row:span 2;font-family:var(--f-mono);font-weight:700;color:var(--acento-3);font-size:1rem;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--acento);border-radius:50%;width:2.2rem;height:2.2rem}
.flujo.sel .fid{background:var(--acento);color:#fff}
.flujo-head .fdesc{font-weight:500}
.flujo-head .fsum{font-size:.85rem;color:var(--tinta-2)}
.fbody{padding:0 .9rem 1rem;border-top:1px solid var(--linea-2)}
.fbody .od{font-size:.88rem;color:var(--tinta-2);margin:.7rem 0}
.ctx{font-size:.9rem;background:var(--papel);border:1px solid var(--linea);border-radius:8px;padding:.45rem .65rem;margin:.5rem 0 .9rem}

/* Panel derecho */
.rightpanel h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2);margin:.25rem 0 .6rem}
.hallazgos{display:flex;flex-direction:column;gap:.45rem;margin-bottom:1.25rem}
.hallazgos .opt label{align-items:flex-start;font-size:.9rem}
.hallazgos .opt label::before{margin-top:.2rem}
.coh{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.coh li{background:var(--tension-bg);border:1px solid var(--tension);border-left-width:4px;border-radius:8px;padding:.55rem .65rem;font-size:.9rem;color:var(--tension-tx)}
.coh .linkbtn{color:var(--tension-tx);font-size:.85rem}
.vacio{font-size:.88rem;color:var(--tinta-2)}

/* Portada */
.portada{max-width:820px;margin:2rem auto}
.portada h1{font-size:1.8rem;letter-spacing:.01em}
.portada .sub{font-size:1.15rem;color:var(--tinta-2);margin-bottom:1.25rem}
.portada ul{padding-left:1.2rem;margin:0 0 1rem}
.portada li{margin:.3rem 0}
.portada .pregunta{border-left:3px solid var(--sello);padding:.2rem 0 .2rem .8rem;color:var(--tinta);font-family:var(--f-doc)}
.portada form{display:flex;flex-direction:column;gap:.5rem;max-width:420px}
.small-print{font-size:.82rem;color:var(--tinta-2)}

/* Documentos */
dialog{border:none;border-radius:12px;padding:0;max-width:min(820px,96vw);width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);color:var(--tinta)}
dialog::backdrop{background:rgba(27,36,48,.45)}
.dlg-head{display:flex;align-items:center;gap:.75rem;padding:.6rem .9rem;border-bottom:1px solid var(--linea);background:var(--sup);position:sticky;top:0;z-index:2}
.dlg-head h2{margin:0;font-size:1rem;flex:1}
.dlg-body{padding:1rem 1.1rem;max-height:calc(90vh - 60px);overflow:auto}
.doc{background:var(--papel);font-family:var(--f-doc);border:1px solid var(--linea);border-radius:8px}
.franja{background:var(--sello);color:#fff;font-family:var(--f-ui);font-size:.82rem;font-weight:600;padding:.4rem .8rem;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.docmeta{font-family:var(--f-ui);font-size:.85rem;color:var(--tinta-2);padding:.6rem 1rem;border-bottom:1px solid var(--linea-2);display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1rem .75rem}
.docmeta dt{font-weight:600}
.docmeta dd{margin:0}
.doctext{padding:1rem 1.1rem}
.doctext h3{font-family:var(--f-ui);font-size:.95rem;margin:1rem 0 .4rem}
.doctext .mail{font-family:var(--f-ui);font-size:.9rem;background:#fff;border:1px solid var(--linea-2);border-radius:6px;padding:.5rem .7rem;margin-bottom:.8rem}
.doctext .mail p{margin:0}
.doctext .cid{font-weight:700}
.doctext ul,.doctext ol{padding-left:1.3rem}
.tw{overflow-x:auto;margin:.5rem 0 1rem}
.tw table{border-collapse:collapse;font-family:var(--f-ui);font-size:.85rem;min-width:520px;width:100%;background:#fff}
.tw th,.tw td{border:1px solid var(--linea);padding:.35rem .5rem;text-align:left;vertical-align:top}
.tw th{background:var(--fondo)}
@media (max-width:600px){
  dialog{max-width:100vw;width:100vw;max-height:100vh;height:100%;border-radius:0;margin:0}
  .dlg-body{max-height:calc(100vh - 56px)}
}

/* E4 */
.guia{font-size:.9rem;color:var(--tinta-2);margin:.2rem 0 .6rem;padding-left:1.1rem}

/* Reporte */
.reporte{max-width:980px;margin:0 auto;background:var(--sup);border:1px solid var(--linea);border-radius:var(--radio);padding:1.5rem 1.75rem}
.reporte h1{font-size:1.35rem;letter-spacing:.02em}
.reporte .rsub{color:var(--tinta-2);margin-bottom:1rem}
.reporte section{border-top:1px solid var(--linea);padding-top:.9rem;margin-top:1rem}
.reporte h2{font-size:1.02rem;display:flex;gap:.5rem}
.reporte h2 .num{font-family:var(--f-mono);color:var(--sello)}
.reporte dl.kv{display:grid;grid-template-columns:minmax(150px,max-content) minmax(0,1fr);gap:.25rem 1rem;margin:0}
.reporte dl.kv dt{font-weight:600}
.reporte dl.kv dd{margin:0}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.75rem}
.rcard{border:1px solid var(--linea);border-radius:8px;padding:.7rem .8rem;break-inside:avoid;page-break-inside:avoid}
.rcard h3{font-size:.95rem;margin-bottom:.35rem}
.rcard dl{margin:0;font-size:.88rem}
.rcard dt{font-weight:600;color:var(--tinta-2);margin-top:.3rem}
.rcard dd{margin:0}
.mod{display:inline-block;font-size:.75rem;border:1px solid var(--sello);color:var(--sello);border-radius:4px;padding:0 .3rem;margin-left:.3rem;font-weight:600}
.reporte ul{padding-left:1.2rem}
.reporte .txt{white-space:pre-wrap;background:var(--papel);border:1px solid var(--linea-2);border-radius:8px;padding:.6rem .8rem;font-size:.95rem}
.retro h3{margin-top:1rem}
.retro ul{margin:.3rem 0 .5rem}
.retro li{margin:.35rem 0}
.acciones-rep{display:flex;gap:.75rem;flex-wrap:wrap;margin:0 0 1rem}
@media (max-width:600px){
  main{padding:1rem .9rem 2.5rem}
  .reporte{padding:1rem .9rem}
  .reporte dl.kv{grid-template-columns:minmax(0,1fr)}
  .reporte dl.kv dd{margin-bottom:.4rem}
  .topbar{padding:.45rem .6rem}
  .btn.small{min-height:44px}
  .topbar{position:static}
  details.helpline summary{min-height:44px}

  /* ---------- utilidades ---------- */
  function lc(t){ return t ? t.charAt(0).toLowerCase() + t.slice(1) : t; }

  /* ---------- funciones derivadas (§14) ---------- */
  function rolF(s,x){ return s.actores[x].rol; }

  function rolEn(s,a,f){
    var A = s.actores[a];

  }
  function etiquetaRolEn(s,a,f){
    var A = s.actores[a];
    if(A.rol==='DIST'){ var r = A.rolPT && A.rolPT[f]; return r ? SUBL[r] : 'sin definir'; }
    return A.rol ? ROL[A.rol] : 'sin definir';
  }

    }
    return ROL[A.rol];
  }
  function evaluarRol(s,x){
    var A = s.actores[x], r = A.rol, pt = A.rolPT || {}, uso = A.usoPropio;
    if(x==='CV') return r==='RESP' ? 'alineado' : 'tension';
    if(x==='CL'){
      if(r==='DIST'){
        if(pt.F1==='ENC' && pt.F3==='ENC') return 'alineado';
        if(enSet(pt.F1,['ENC','PEND']) && enSet(pt.F3,['ENC','PEND'])) return 'defendible';
        return 'tension';
      }
      if(r==='ENC') return 'alineado';
      if(r==='PEND') return 'defendible';
      return 'tension';
    }
    if(x==='VA'){ if(r==='ENC') return 'alineado'; if(r==='PEND') return 'defendible'; return 'tension'; }
    if(x==='BA'){ if(r==='SUB') return 'alineado'; if(r==='PEND') return 'defendible'; return 'tension'; }
    if(x==='MP'){
      if(r==='DIST'){
        var f5ok = enSet(pt.F5,['PEND','TER','RESPT']);
        if(pt.F4==='ENC' && f5ok) return 'alineado';
        if(pt.F4==='PEND' && f5ok) return 'defendible';
        return 'tension';
      }
      if(r==='PEND' && enSet(uso,['SI','POS'])) return 'defendible';
      if(r==='ENC' && enSet(uso,['SI','POS'])) return 'defendible';
      if((r==='TER' || r==='RESP') && uso==='SI') return 'defendible';

  }

  function aceptacionEtiquetas(s){

  var f = [];

  }

    M.ACT_ORDEN.forEach(function(x){

      if(x!=='CV' && !a.porCuenta) p.push('¿actúa por cuenta de CumbreViva?');

    });
  }
  if(e==='E2'){
    M.ACT_ORDEN.forEach(function(x){
      var a = S.actores[x], p = [];
      if(x!=='CV' && !a.porCuenta) p.push('¿actúa por cuenta de CumbreViva?');
      if(!a.rol) p.push('rol propuesto');
      if(a.rol==='DIST') M.TRAT[x].forEach(function(t){ if(!a.rolPT || !a.rolPT[t]) p.push('rol en '+t); });
      if(x!=='CV'){
        if(!a.instrucciones) p.push('instrucciones documentadas');
        if(!a.usoPropio) p.push('uso para finalidad propia');
        if(!a.evidencia) p.push('evidencia principal');
        if(!a.incertidumbre) p.push('incertidumbre pendiente');
      }
      if(x==='CL' && !S.subcCL) p.push('subcontratación');
      if(p.length) f.push(M.NOMBRE[x] + ' (' + p.join(', ') + ')');
    });
    var w = M.palabras(S.j1);
    if(w<40 || w>100) f.push('justificación sobre Metrivara entre 40 y 100 palabras (llevas ' + w + ')');
  }
  if(e==='E3'){
    M.FL_ORDEN.forEach(function(fl){
      var p = [];
      if(!S.flujos[fl].tipo) p.push('tipo');
      if(!S.flujos[fl].falta.length) p.push('faltante');
      if(p.length) f.push(fl + ' (' + p.join(', ') + ')');
    });
    if(!S.j2Flujo) f.push('flujo elegido en la segunda justificación');
    var w2 = M.palabras(S.j2);
    if(w2<40 || w2>100) f.push('segunda justificación entre 40 y 100 palabras (llevas ' + w2 + ')');
  }
  if(e==='E4'){
    if(!S.coordinacion) f.push('coordinación de la respuesta');
    if(!S.acciones.length) f.push('al menos una acción');
    var w3 = M.palabras(S.recomendacion);
    if(w3<150 || w3>300) f.push('recomendación ejecutiva entre 150 y 300 palabras (llevas ' + w3 + ')');
  }
  return f;
}

  return true;
}

function opcion(tipo, name, val, label, checked, extra){
  var id = 'in-' + name.replace(/[^A-Za-z0-9]/g,'-') + '-' + val;
  return '<div class="opt"><input type="'+tipo+'" id="'+id+'" name="'+name+'" value="'+val+'"'+(checked?' checked':'')+(extra||'')+'><label for="'+id+'">'+label+'</label></div>';
}
function grupo(legend, name, mapaOpc, valor, opts){
  opts = opts || {};
  var tipo = opts.multi ? 'checkbox' : 'radio';
  var h = '<fieldset><legend>'+legend+(opts.ayuda?' '+ayudaHTML(opts.ayuda, name):'')+'</legend><div class="opts'+(opts.col?' col':'')+'">';
  (opts.orden || Object.keys(mapaOpc)).forEach(function(k){
    var chk = opts.multi ? has(valor,k) : valor===k;
    var dis = opts.deshabilitar && opts.deshabilitar[k];
    h += opcion(tipo, name, k, esc(mapaOpc[k]) + (dis ? ' <span class="hint">('+esc(dis)+')</span>' : ''), chk, dis ? ' disabled' : '');
  });
  return h + '</div>' + (opts.post||'') + '</fieldset>';
}
var ayudaN = 0;
function ayudaHTML(t, key){ ayudaN++; return '<details class="help"><summary aria-label="Ayuda">i</summary><span class="helptx">'+esc(t)+'</span></details>'; }
function ayudaBloque(titulo, t){ return '<details class="help helpline"><summary>¿Qué significa “'+esc(titulo)+'”?</summary><span class="helptx">'+esc(t)+'</span></details>'; }

/* ---------- ficha de actor ---------- */
function rolOpciones(x, etapa){
  var o = {RESP:M.ROL.RESP, ENC:M.ROL.ENC, TER:M.ROL.TER, SUB:M.ROL.SUB, PEND:M.ROL.PEND};
  var dis = null;
  if(etapa!=='E1' && x!=='CV'){
    o.DIST = M.ROL.DIST;
    if(x==='VA' || x==='BA') dis = {DIST:'Interviene en un solo tratamiento del caso'};
  }
  return {o:o, dis:dis};
}
function fichaHTML(x, etapa){
  var A = ACTOR[x], a = S.actores[x], e2 = etapa!=='E1', h = [];
  h.push('<div class="fhead"><h2 id="ficha-tit-'+x+'">'+esc(A.titulo)+'</h2><p class="razon">'+esc(A.razon)+'</p><p class="para"><strong>Para qué interviene:</strong> '+esc(A.para)+'</p>');
  if(e2 && A.etiqueta) h.push('<span class="etq">Etiqueta contractual: '+esc(A.etiqueta)+'</span>');
  h.push('</div>');
  if(x==='CV'){
    h.push('<p class="hint">¿Actúa por cuenta de CumbreViva? Es CumbreViva.</p>');
  } else {
    h.push(grupo('¿Actúa por cuenta de CumbreViva?', 'a.'+x+'.porCuenta', M.PORCUENTA, a.porCuenta, {ayuda:AYUDA.porCuenta}));
  }
  var ro = rolOpciones(x, etapa);
  var ay = ayudaBloque('Tercero receptor', AYUDA.tercero) + ayudaBloque('Subcontratado del encargado', AYUDA.subcontratado);
  h.push(grupo('Rol propuesto', 'a.'+x+'.rol', ro.o, a.rol, {deshabilitar:ro.dis, post:'<div style="margin-top:.4rem;display:flex;flex-direction:column;gap:.1rem">'+ay+'</div>'}));
  if(e2 && a.rol==='DIST'){
    h.push('<div class="subroles"><p class="hint">'+esc(AYUDA.porTrat)+'</p>');
    M.TRAT[x].forEach(function(t){
      h.push(grupo(esc(M.TRAT_L[t]), 'a.'+x+'.rolPT.'+t, M.SUBL, a.rolPT && a.rolPT[t], {}));
    });
    h.push(ayudaBloque('Responsable de ese tratamiento', AYUDA.respTrat) + '</div>');
  }
  if(e2 && x!=='CV'){
    h.push('<p class="sec">Contratos y conducta</p>');
    h.push(grupo('Instrucciones documentadas', 'a.'+x+'.instrucciones', M.INSTR, a.instrucciones));
    h.push(grupo('Uso para finalidad propia', 'a.'+x+'.usoPropio', M.USO, a.usoPropio));
    if(x==='CL') h.push(grupo('Subcontratación', 'subcCL', M.SUBC, S.subcCL));
    else if(x==='BA') h.push('<div class="field"><p class="lbl">Subcontratación</p><p class="derivado">Subcontratado por Orbiax · Autorización: '+esc(S.subcCL ? M.SUBC[S.subcCL] : 'sin definir (se responde en la ficha de Orbiax)')+'</p></div>');
    else h.push('<div class="field"><p class="lbl">Subcontratación</p><p class="derivado">No se analiza en este caso</p></div>');
    var docs = docsDisponibles();
    var sid = 'sel-ev-'+x;
    h.push('<div class="field" style="margin-bottom:1rem"><label class="lbl" for="'+sid+'">Evidencia principal</label><select id="'+sid+'" name="a.'+x+'.evidencia"><option value="">Elige un documento</option>' + docs.map(function(d){ return '<option value="'+d+'"'+(a.evidencia===d?' selected':'')+'>'+d+' · '+esc(DOCS[d].titulo)+'</option>'; }).join('') + '</select></div>');
    var iid = 'sel-in-'+x;
    h.push('<div class="field"><label class="lbl" for="'+iid+'">Incertidumbre pendiente</label><select id="'+iid+'" name="a.'+x+'.incertidumbre"><option value="">Elige una opción</option>' + Object.keys(M.INCERT).map(function(k){ return '<option value="'+k+'"'+(a.incertidumbre===k?' selected':'')+'>'+esc(M.INCERT[k])+'</option>'; }).join('') + '</select></div>');
  }
  return h.join('');
}

    var orden = ['H1','H2','H3'].concat(dispH4 ? ['H4'] : []).concat(['H5','H6']);
    h += '<section aria-labelledby="hall-tit"><h2 id="hall-tit">Hallazgos</h2><p class="hint">Marca los enunciados que registrarías como hallazgo. <span id="hall-cont">'+S.hallazgos.length+' registrados</span>.</p><div class="hallazgos">' +
      orden.map(function(k){ return opcion('checkbox','hall',k,esc(M.HALL[k]),has(S.hallazgos,k), S.cerrado?' disabled':''); }).join('') + '</div></section>';
  }
  var k = M.conflictos(S, idx(S.etapa) >= idx('E3'));

  h += '</section>';
  return h;
}

function contador(w, min, max){ return w + ' palabras · requerido: ' + min + '–' + max; }
function contadorRec(w){
  var t = w + ' palabras · orientación 180–250';
  if(w>0 && (w<180 || w>250)) t += (w<150 || w>300) ? ' · para cerrar se requieren entre 150 y 300' : ' · se sugiere 180–250 palabras';
  return t;
}

/* ---------- cambios de valores ---------- */
function aplicarCambio(t){
  var name = t.name, val = t.value;
  if(!S || S.cerrado || !name) return false;
  var p = name.split('.');
  if(name==='hip'){ S.hipotesis = val; }
  else if(name==='conf'){ S.confianza = val; }
  else if(p[0]==='a'){
    var a = S.actores[p[1]];
    if(p[2]==='rolPT'){ a.rolPT = a.rolPT || {}; a.rolPT[p[3]] = val; }
    else if(p[2]==='rol'){
      if(a.rol==='DIST' && val!=='DIST' && a.rolPT && Object.keys(a.rolPT).length){ a.rolPT = {}; anunciar('Se descartaron los roles por tratamiento de ' + M.NOMBRE[p[1]] + '.'); }
      a.rol = val;
    }
    else a[p[2]] = val || null;
  }
  else if(name==='subcCL'){ S.subcCL = val; }
  else if(p[0]==='f' && p[2]==='tipo'){ S.flujos[p[1]].tipo = val; }
  else if(p[0]==='f' && p[2]==='falta'){
    var fa = S.flujos[p[1]].falta, msg = $('msg-falta-'+p[1]);
    if(msg) msg.textContent = '';
    if(t.checked){
      if(val==='M7'){ S.flujos[p[1]].falta = ['M7']; }
      else {
        fa = fa.filter(function(m){ return m!=='M7'; });
        if(fa.length >= 2){ t.checked = false; if(msg) msg.textContent = 'Elige como máximo dos faltantes; quita uno para agregar otro.'; return false; }
        fa.push(val); S.flujos[p[1]].falta = fa;
      }
    } else S.flujos[p[1]].falta = fa.filter(function(m){ return m!==val; });
  }
  else if(name==='hall'){
    if(t.checked){ if(!has(S.hallazgos,val)) S.hallazgos.push(val); } else S.hallazgos = S.hallazgos.filter(function(h){ return h!==val; });
  }
  else if(name==='j2Flujo'){ S.j2Flujo = val || null; }
  else if(name==='coord'){ S.coordinacion = val; }
  else if(name==='acc'){
    var m = $('msg-acc'); if(m) m.textContent = '';
    if(t.checked){
      if(S.acciones.length >= 4){ t.checked = false; if(m) m.textContent = 'Puedes elegir hasta cuatro acciones; quita una para agregar otra.'; return false; }
      S.acciones.push(val);
    } else S.acciones = S.acciones.filter(function(a){ return a!==val; });
  }
  else if(name==='rev'){
    var mr = $('msg-rev'); if(mr) mr.textContent = '';
    if(t.checked){
      if(S.revisiones.length >= 3){ t.checked = false; if(mr) mr.textContent = 'Puedes elegir hasta tres puntos; quita uno para agregar otro.'; return false; }
      S.revisiones.push(val);
    } else S.revisiones = S.revisiones.filter(function(a){ return a!==val; });
  }
  else return false;
  return true;
}
document.addEventListener('change', function(ev){
  var t = ev.target;

  if(aplicarCambio(t)){

  var w = M.palabras(t.value);
  if(k==='j1'){ var c = $('j1c'); c.textContent = contador(w,40,100); c.classList.toggle('fuera', w>0 && (w<40||w>100)); }
  if(k==='j2'){ var c2 = $('j2c'); c2.textContent = contador(w,40,100); c2.classList.toggle('fuera', w>0 && (w<40||w>100)); }
  if(k==='recomendacion'){ var c3 = $('recc'); c3.textContent = contadorRec(w); c3.classList.toggle('fuera', w>0 && (w<180||w>250)); }
  guardar();
});
document.addEventListener('click', function(ev){
  var cerrar = ev.target.closest && ev.target.closest('[data-close]');
  if(cerrar){ cerrarDialogo(cerrar.getAttribute('data-close')); return; }
  var el = ev.target.closest && ev.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if(act==='abrir-actor') abrirActor(id);
  else if(act==='sel-flujo') selFlujo(id, el.tagName.toLowerCase()==='g');
  else if(act==='abrir-doc') abrirDoc(id, el);
  else if(act==='continuar') continuar(id);
  else if(act==='cerrar') cerrarExpediente();
  else if(act==='ir-etapa'){ if(idx(id) <= idx(S.etapa)){ ui.vista = id; renderVista(); } }
  else if(act==='expediente'){ $('expDialogBody').innerHTML = listaDocsHTML(); $('expDialog').showModal(); }
  else if(act==='nuevo') nuevoExpediente();
  else if(act==='continuar-exp'){ ui = {vista:null, actorSel:null, flujoSel:null, opener:null, docAbierto:null, fichaDialogActor:null}; renderVista(); }
  else if(act==='imprimir') window.print();
  else if(act==='ir-actor'){ if(ui.vista==='E1' || ui.vista==='E2') abrirActor(id); else abrirActor(id); }
  else if(act==='ir-flujo'){ if(ui.vista!=='E3'){ ui.vista = 'E3'; renderVista(false); } ui.flujoSel = id; refrescarPartes(); var h = $('fh-'+id); if(h){ irA($('flujo-'+id)); h.focus({preventScroll:true}); } }
});
document.addEventListener('keydown', function(ev){
  var t = ev.target;
  if((ev.key==='Enter' || ev.key===' ') && t.getAttribute && t.getAttribute('role')==='button' && t.tagName.toLowerCase()==='g'){
    ev.preventDefault(); t.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  }
});
$('docUse').addEventListener('click', function(){
  var x = this.dataset.actor; if(!x || !ui.docAbierto || S.cerrado) return;
  S.actores[x].evidencia = ui.docAbierto; guardar();
  anunciar(ui.docAbierto + ' quedó como evidencia principal de ' + ACTOR[x].titulo + '.');
  this.textContent = 'Asignado como evidencia principal de ' + ACTOR[x].titulo;
  refrescarPartes();
});
document.addEventListener('submit', function(ev){
  if(ev.target.id!=='formInicio') return;
  ev.preventDefault();
  var n = $('nombre').value.trim(), m = $('nombre-msg');
  if(!n){ m.textContent = 'Escribe tu nombre para abrir el expediente.'; $('nombre').focus(); return; }
  iniciar(n.slice(0,60));
});
