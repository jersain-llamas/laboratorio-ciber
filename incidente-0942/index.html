    '<div class="intro"><p>Te incorporas al equipo de respuesta a incidentes de Nuvora Casa Digital, S.A. de C.V., en el rol de <strong>Coordinación de Protección de Datos Personales</strong>. Tu función es traducir evidencia técnica en decisiones jurídicas y de gobernanza, y dejar un expediente defendible.</p><ul>' +

    '<form id="formInicio" class="form-inicio" novalidate><div class="campo-texto"><label for="pNombre">Nombre del participante</label><input id="pNombre" type="text" autocomplete="name" required value="' + esc(ST.participante.nombre) + '"></div>' +
    '<div class="campo-texto"><label for="pId">Identificador (opcional)</label><input id="pId" type="text" value="' + esc(ST.participante.identificador) + '"></div>' +
    '<p id="errInicio" class="error" role="alert" hidden>Escribe tu nombre para abrir el expediente.</p>' +
    '<div class="acciones-fila"><button type="submit" class="boton principal">' + (guardado ? 'Continuar el expediente' : 'Abrir expediente') + '</button> <button type="button" class="boton secundario" data-accion="cargarJSON">Cargar expediente</button></div></form>' +
    '<p class="pie-doc">Documento simulado para fines de entrenamiento.</p></div></main>';
}
function vistaReporte() {
  var perf = L.perfil(ST);
  return '<main id="trabajo" tabindex="-1" class="reporte-main"><div class="encabezado-etapa"><p class="eyebrow">Cierre · Martes</p><h2 id="tituloEtapa" tabindex="-1">Reporte del expediente</h2></div>' +
    '<div class="acciones-fila no-print" role="group" aria-label="Acciones del reporte"><button type="button" class="boton principal" data-accion="copiar">Copiar reporte</button><button type="button" class="boton" data-accion="imprimir">Imprimir o guardar como PDF</button><button type="button" class="boton secundario" data-accion="descargarJSON">Descargar expediente (JSON)</button><button type="button" class="boton secundario" data-accion="cargarJSON">Cargar expediente</button><button type="button" class="boton secundario" data-accion="reiniciar">Iniciar un nuevo expediente</button></div>' +
    '<article id="reporte" class="reporte" aria-labelledby="repTitulo"><div class="marca-agua" aria-hidden="true">Documento simulado para fines de entrenamiento</div><header class="rep-cab"><p class="sello-sim">SIMULACIÓN</p><h1 id="repTitulo">REPORTE DE RESPUESTA A VULNERACIÓN DE DATOS PERSONALES</h1><p class="subt">Laboratorio 01 · Incidente 09:42 · Expediente INC-NCD-0917</p><p class="pie-doc">Documento simulado para fines de entrenamiento. Nuvora Casa Digital, S.A. de C.V. es una organización ficticia.</p></header>' +
    L.reporteHTML(ST) + '</article></main>';
}

function render() {
  var app = document.getElementById('app');
  var y = window.scrollY;
  var foco = document.activeElement && document.activeElement.id;
  if (ST.etapaActual < 0) { app.innerHTML = inicio(); }
  else if (ST.etapaActual >= 6) { app.innerHTML = cabecera() + vistaReporte(); }
  else {
    app.innerHTML = cabecera() + '<div class="disposicion"><aside class="bandeja" aria-labelledby="hBandeja">' + bandeja() + '</aside><main id="trabajo" tabindex="-1">' + trabajo() + '</main><aside class="lateral" aria-label="Seguimiento del incidente">' + lateral() + '</aside></div>';
  }
  mostrarAvisoMemoria();
  if (foco) { var el = document.getElementById(foco); if (el) { el.focus({ preventScroll: true }); } }
  window.scrollTo(0, y);
}
function refrescarLaterales() {
  var b = document.querySelector('.bandeja'); if (b) b.innerHTML = bandeja();
  var l = document.querySelector('.lateral'); if (l) l.innerHTML = lateral();
}

/* ---------- Documento ---------- */
var ultimoFoco = null, ultimoDoc = null;
function abrirDoc(id) {
  var k = Math.min(ST.etapaActual, 5);
  if (!L.recibido(ST, id, k)) return;
  var d = L.documento(ST, id);
  if (ST.docsAbiertos[id] === undefined) { ST.docsAbiertos[id] = k; guardar(); }
  var dlg = document.getElementById('docDialog');
  document.getElementById('docContenido').innerHTML = '<div class="doc-hoja"><div class="doc-cab"><span class="sello-sim">SIMULACIÓN</span><dl class="doc-datos"><dt>Folio</dt><dd>' + d.folio + '</dd><dt>Tipo</dt><dd>' + esc(d.tipo) + '</dd><dt>Remitente</dt><dd>' + esc(d.remitente) + '</dd><dt>Hora narrativa</dt><dd>' + esc(d.hora) + '</dd></dl>' +
    (d.tardio ? '<p class="etq tarde">Recibido tardíamente (no priorizada)</p>' : '') + '</div><h2 id="docTitulo">' + esc(d.titulo) + '</h2><div class="doc-cuerpo">' + d.html + '</div>' +
    '<footer class="doc-pie">' + (d.simulado ? '<p>Resultado simulado. No proviene de un sistema real.</p>' : '') + '<p>Documento simulado para fines de entrenamiento.</p><p>Nuvora Casa Digital, S.A. de C.V. es una organización ficticia.</p></footer></div>';
  ultimoDoc = id;
  refrescarLaterales();
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  var c = document.getElementById('cerrarDoc'); if (c) c.focus();
}
function cerrarDoc() {
  var dlg = document.getElementById('docDialog');
  if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
}

/* ---------- Confirmación ---------- */
var confirmarAccion = null;
function confirmar(texto, etiquetaSi, fn) {
  var dlg = document.getElementById('confDialog');
  document.getElementById('confTexto').textContent = texto;
  document.getElementById('confSi').textContent = etiquetaSi;
  confirmarAccion = fn;
  ultimoFoco = document.activeElement;
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  document.getElementById('confNo').focus();
}

/* ---------- Acciones ---------- */
function cerrarEtapa() {
  var errs = validar(ST.etapaActual);
  var box = document.getElementById('errores');
  if (errs.length) {
    box.hidden = false;
    box.innerHTML = '<h3>Antes de avanzar, completa:</h3><ul>' + errs.map(function (e) { return '<li><a href="#' + e[0] + '" data-ir="' + e[0] + '">' + esc(e[1]) + '</a></li>'; }).join('') + '</ul>';
    box.setAttribute('tabindex', '-1'); box.focus();
    return;
  }
  box.hidden = true;
  var k = ST.etapaActual;
  confirmar(k < 5 ? 'Al avanzar, estas decisiones quedan registradas en la bitácora con hora ' + (k === 0 ? '09:55' : HORA_BIT[k]) + '. No podrás modificarlas después.' : 'Al cerrar, el expediente queda registrado y se genera el reporte. No podrás modificar las decisiones.', k < 5 ? 'Avanzar' : 'Cerrar y generar el reporte', avanzar);
}
function descargarJSON() {
  var blob = new Blob([JSON.stringify(ST, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'expediente_incidente0942' + (ST.participante.identificador ? '_' + ST.participante.identificador.replace(/[^a-zA-Z0-9_-]/g, '') : '') + '.json';
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  anunciar('Expediente descargado.');
}
function cargarJSONArchivo(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var o = JSON.parse(r.result);
      if (!o || o.esquema !== L.ESQUEMA) { alertaCarga('El archivo no corresponde a un expediente de este laboratorio.'); return; }
      if (o.version !== L.VERSION) { alertaCarga('La versión del expediente (' + o.version + ') no es compatible con esta versión del laboratorio (' + L.VERSION + ').'); return; }
      ST = completarEstado(o); guardar(); render(); anunciar('Expediente cargado.');
      var h = document.getElementById('tituloEtapa'); if (h) h.focus();
    } catch (e) { alertaCarga('No fue posible leer el archivo: no es un JSON válido.'); }
  };
  r.readAsText(file);
}
function alertaCarga(t) { anunciar(t); window.alert(t); }
function copiarReporte() {
  var t = L.reporteTexto(ST);
  function ok() { anunciar('Reporte copiado al portapapeles.'); var b = document.querySelector('[data-accion="copiar"]'); if (b) { b.textContent = 'Reporte copiado'; setTimeout(function () { b.textContent = 'Copiar reporte'; }, 2500); } }
  function respaldo() {
    var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    var r = false; try { r = document.execCommand('copy'); } catch (e) { r = false; } ta.remove();
    if (r) ok(); else anunciar('No fue posible copiar automáticamente. Usa «Descargar expediente» o selecciona el texto del reporte.');
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, respaldo); else respaldo();
}
function reiniciar() {
  confirmar('Se borrará el expediente actual de este navegador. Si quieres conservarlo, descárgalo antes.', 'Iniciar un nuevo expediente', function () {
    try { window.localStorage.removeItem(L.CLAVE); } catch (e) { /* memoria */ }
    ST = L.estadoInicial(); render(); var t = document.getElementById('trabajo'); if (t) t.focus();
  });
}

/* ---------- Eventos ---------- */
function alCambiar(e) {
  var el = e.target;
  if (!el || !el.dataset) return;
  var rr = !!el.dataset.rr;
  if (el.dataset.bind) {
    var v = el.value;
    setPath(el.dataset.bind, v);
    if (el.dataset.bind === 'decisiones.E4.estrategia') { precargaEstrategia(v); rr = true; }
    if (/\.porGrupo\.[^.]+\.accion$/.test(el.dataset.bind)) {
      var gp = el.dataset.bind.replace(/\.accion$/, '');
      var o = getPath(gp); if (v !== 'noNotificar' && v !== 'documentar') { delete o.razon; delete o.disparadores; }
      rr = true;
    }
    if (/\.razon$/.test(el.dataset.bind)) { rr = true; }
    if (el.dataset.bind === 'e0.clasificacion' && v !== 'c') { delete ST.panel.E0; }
    if (/^panel\.E\d\.nivel$/.test(el.dataset.bind)) rr = true;
  } else if (el.dataset.arr) {
    var arr = (getPath(el.dataset.arr) || []).slice();
    var i = arr.indexOf(el.value);
    if (el.checked && i < 0) arr.push(el.value);
    if (!el.checked && i >= 0) arr.splice(i, 1);
    setPath(el.dataset.arr, arr);
    if (el.dataset.max) rr = true;
  } else if (el.dataset.bool) {
    setPath(el.dataset.bool, el.checked);
    if (el.dataset.bool === 'divisionGSAL') { asegurarSig('E5'); }
  } else if (el.dataset.espera) {
    var d = ST.decisiones['E' + el.dataset.espera];
    d.espera = (d.espera || []).filter(function (x) { return x.item !== el.value; });
    if (el.checked) d.espera.push({ item: el.value, cambia: '' });
    rr = true;
  } else if (el.dataset.esperaCambia) {
    var d2 = ST.decisiones['E' + el.dataset.esperaCambia];
    (d2.espera || []).forEach(function (x) { if (x.item === el.dataset.item) x.cambia = el.value; });
  } else if (el.dataset.ar) {
    var q = el.dataset.ar, cur = ST.comunicacion.autorrevision[q];
    if (el.value === 'no') ST.comunicacion.autorrevision[q] = el.checked ? 'no' : undefined;
    else {
      var a = Array.isArray(cur) ? cur.slice() : [];
      var n = +el.value, j = a.indexOf(n);
      if (el.checked && j < 0) a.push(n); if (!el.checked && j >= 0) a.splice(j, 1);
      ST.comunicacion.autorrevision[q] = a.length ? a.sort(function (x, y) { return x - y; }) : undefined;
    }
    rr = true;
  } else if (el.dataset.ajuste) {
    var par = +el.dataset.ajuste;
    var aj = (ST.comunicacion.ajustesE5 || []).filter(function (x) { return x.parrafo !== par; });
    if (el.checked) aj.push({ parrafo: par, tipo: 'precision' });
    aj.sort(function (x, y) { return x.parrafo - y.parrafo; });
    ST.comunicacion.ajustesE5 = aj;
  } else if (el.dataset.ajusteTipo) {
    (ST.comunicacion.ajustesE5 || []).forEach(function (x) { if (x.parrafo === +el.dataset.ajusteTipo) x.tipo = el.value; });
  } else return;
  guardar();
  if (rr) { render(); }
  else if (ST.etapaActual >= 0 && ST.etapaActual <= 5 && !el.matches('textarea, input[type="text"]')) { var l = document.querySelector('.lateral'); if (l) l.innerHTML = lateral(); }
}
function alEscribir(e) {
  var el = e.target;
  if (!el.dataset || !el.dataset.bind || !el.matches('textarea')) return;
  setPath(el.dataset.bind, el.value);
  var c = document.getElementById('cnt_' + el.id);
  if (c) c.textContent = contadorTexto(el.value, el.dataset.contador, el.getAttribute('maxlength') && !el.dataset.contador ? +el.getAttribute('maxlength') : null);
  guardar();
}
function alClic(e) {
  var t = e.target.closest('[data-doc],[data-accion],[data-tab],[data-ir]');
  if (!t) return;
  if (t.dataset.doc) { abrirDoc(t.dataset.doc); return; }
  if (t.dataset.tab) { UI.lateral = t.dataset.tab; var l = document.querySelector('.lateral'); if (l) { l.innerHTML = lateral(); var b = document.getElementById('tab-' + UI.lateral); if (b) b.focus(); } return; }
  if (t.dataset.ir) { e.preventDefault(); var x = document.getElementById(t.dataset.ir); if (x) { x.scrollIntoView({ block: 'center' }); if (x.focus) x.focus(); } return; }
  var a = t.dataset.accion;
  var c = ST.comunicacion;
  switch (a) {
    case 'cerrarEtapa': cerrarEtapa(); break;
    case 'revisarCom':
      if (!L.palabras(c.v1)) { anunciar('Escribe la comunicación antes de revisarla.'); var ed = document.getElementById(idDe('comunicacion.v1')); if (ed) ed.focus(); return; }
      c.fase = 'revisar'; guardar(); render(); enfocar('sec-redaccion'); break;
    case 'ajustarCom':
      if (!autorrevCompleta()) { anunciar('Responde las siete preguntas de la autorrevisión.'); return; }
      c.fase = 'ajustar'; c.v2 = c.v1; guardar(); render(); enfocar(idDe('comunicacion.v2')); break;
    case 'mantenerCom':
      if (!autorrevCompleta()) { anunciar('Responde las siete preguntas de la autorrevisión.'); return; }
      c.fase = 'lista'; c.v2 = null; guardar(); render(); enfocar('sec-redaccion'); break;
    case 'guardarV2': c.fase = 'lista'; guardar(); render(); enfocar('sec-redaccion'); anunciar('Versión revisada guardada.'); break;
    case 'descargarJSON': descargarJSON(); break;
    case 'cargarJSON': document.getElementById('archivoJSON').click(); break;
    case 'reiniciar': reiniciar(); break;
    case 'copiar': copiarReporte(); break;
    case 'imprimir': window.print(); break;
    case 'cerrarDoc': cerrarDoc(); break;
  }
}
function autorrevCompleta() { var ar = ST.comunicacion.autorrevision || {}; return L.AUTORREV.every(function (q) { return ar[q[0]] === 'no' || (Array.isArray(ar[q[0]]) && ar[q[0]].length); }); }
function enfocar(id) { var x = document.getElementById(id); if (x) { if (!x.hasAttribute('tabindex') && !/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(x.tagName)) x.setAttribute('tabindex', '-1'); x.focus(); x.scrollIntoView({ block: 'start' }); } }
function teclasPestanas(e) {
  var t = e.target; if (!t.dataset || !t.dataset.tab) return;
  var orden = ['estado', 'timeline', 'bitacora']; var i = orden.indexOf(t.dataset.tab);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); UI.lateral = orden[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3];
    var l = document.querySelector('.lateral'); if (l) { l.innerHTML = lateral(); document.getElementById('tab-' + UI.lateral).focus(); }
  }
}

/* ---------- Inicio ---------- */
function iniciar() {
  probarAlmacen();
  ST = cargarGuardado() || L.estadoInicial();
  ST = completarEstado(ST);
  document.addEventListener('change', alCambiar);
  document.addEventListener('input', alEscribir);
  document.addEventListener('click', alClic);
  document.addEventListener('keydown', teclasPestanas);
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'formInicio') return;
    e.preventDefault();
    var n = document.getElementById('pNombre').value.trim();
    if (!n) { var er = document.getElementById('errInicio'); er.hidden = false; document.getElementById('pNombre').focus(); return; }
    ST.participante.nombre = n; ST.participante.identificador = document.getElementById('pId').value.trim();
    if (ST.etapaActual < 0) { ST.etapaActual = 0; ST.inicioReal = new Date().toISOString(); entrarEtapa(0); }
    guardar(); render(); var h = document.getElementById('tituloEtapa'); if (h) h.focus();
    anunciar('Expediente abierto. Etapa E0, lunes 09:42. Hay 3 documentos en la bandeja.');
  });
  document.getElementById('archivoJSON').addEventListener('change', function (e) { var f = e.target.files[0]; if (f) cargarJSONArchivo(f); e.target.value = ''; });
  document.getElementById('cerrarDoc').addEventListener('click', cerrarDoc);
  var dd = document.getElementById('docDialog');
  dd.addEventListener('close', function () { var b = ultimoDoc && document.querySelector('.bandeja [data-doc="' + ultimoDoc + '"]'); if (!b) b = ultimoDoc && document.querySelector('[data-doc="' + ultimoDoc + '"]'); if (b) b.focus(); });
  var cd = document.getElementById('confDialog');
  document.getElementById('confNo').addEventListener('click', function () { cd.close(); if (ultimoFoco) ultimoFoco.focus(); });
  document.getElementById('confSi').addEventListener('click', function () { cd.close(); var f = confirmarAccion; confirmarAccion = null; if (f) f(); });
  render();
}
window.LAB_UI = { estado: function () { return ST; } };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();

</script>
</body>
