<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio 03 · Sólo era telemetría</title>
<meta name="description" content="Laboratorio de entrenamiento sobre identificabilidad, finalidad y conservación de la telemetría de seguridad. Caso simulado.">
<style>
:root{
  --papel:#f6f5f1;
  --papel-2:#efede6;
  --hoja:#ffffff;
  --tinta:#1b2230;
  --tinta-2:#3b4556;
  --tenue:#5b6474;
  --regla:#d6d2c6;
  --regla-2:#bdb8aa;
  --acento:#2c5874;
  --acento-2:#e3edf3;
  --acento-3:#c7d9e4;
  --linea:#4f6d86;
  --log:#f1efe8;
  --aviso:#6b4a10;
  --aviso-fondo:#fbf3e2;
  --foco:#1f5fbf;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --radio:6px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.derivado{display:block;font-size:.8rem;color:var(--tenue);margin-top:.2rem}
.meta-n{font-size:.85rem;color:var(--tenue)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.55 var(--sans);overflow-x:hidden}
a{color:var(--acento)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0 0 .8em}
code,.mono{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.saltar{position:absolute;left:-999px;top:0;background:var(--hoja);padding:.5rem 1rem;z-index:50}
.saltar:focus{left:1rem;top:.5rem}

/* Barra superior */
.barra{position:sticky;top:0;z-index:20;background:var(--hoja);border-bottom:1px solid var(--regla);}
.barra-in{max-width:1240px;margin:0 auto;padding:.55rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.marca{font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2)}
.etapas{display:flex;gap:.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.etapas li{font-size:.78rem;padding:.2rem .5rem;border:1px solid var(--regla);border-radius:99px;color:var(--tenue);background:var(--papel)}
.etapas li[aria-current="step"]{border-color:var(--acento);color:var(--acento);background:var(--acento-2);font-weight:600}
.etapas li.hecha{color:var(--tinta-2)}
.barra-der{margin-left:auto;display:flex;gap:.75rem;align-items:center}
.guardado{font-size:.8rem;color:var(--tenue);font-family:var(--mono)}
.aviso-alm{max-width:1240px;margin:.5rem auto 0;padding:0 1rem}
.aviso-alm p{margin:0;font-size:.85rem;background:var(--aviso-fondo);color:var(--aviso);border:1px solid #e6d3a8;border-radius:var(--radio);padding:.4rem .7rem}

/* Botones y controles */
.btn{font:inherit;font-size:.95rem;border:1px solid var(--acento);background:var(--acento);color:#fff;border-radius:var(--radio);padding:.55rem 1rem;cursor:pointer;min-height:44px}
.btn:hover{background:#244b63}
.btn.sec{background:var(--hoja);color:var(--acento)}
.btn.sec:hover{background:var(--acento-2)}
.btn.peq{font-size:.85rem;padding:.35rem .7rem;min-height:36px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
select,input[type=text],textarea{font:inherit;font-size:.92rem;color:var(--tinta);background:var(--hoja);border:1px solid var(--regla-2);border-radius:var(--radio);padding:.4rem .5rem;max-width:100%}
select{min-height:40px;width:100%}
textarea{width:100%;min-height:9rem;line-height:1.5;resize:vertical}
fieldset{border:0;margin:0 0 1rem;padding:0;min-width:0}
legend{font-weight:600;margin-bottom:.4rem;padding:0}
.opcion{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .65rem;border:1px solid var(--regla);border-radius:var(--radio);background:var(--hoja);margin-bottom:.4rem;cursor:pointer}
.opcion input{margin-top:.25rem;flex:none;width:1.05rem;height:1.05rem}
.opcion:hover{border-color:var(--regla-2)}
.opcion:has(input:checked){border-color:var(--acento);background:var(--acento-2)}
.opcion .det{display:block;font-size:.85rem;color:var(--tenue);margin-top:.15rem}
.chk{display:flex;gap:.45rem;align-items:flex-start;font-size:.84rem;margin:.2rem 0;cursor:pointer}
.chk input{margin-top:.2rem;flex:none}
.fila-op{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.4rem}

/* Distribución */
main{max-width:1240px;margin:0 auto;padding:1.25rem 1rem 4rem}
.etapa-cab{margin-bottom:1.25rem}
.etapa-cab .num{font-family:var(--mono);font-size:.8rem;color:var(--tenue);letter-spacing:.05em}
.etapa-cab h1:focus{outline:none}
.guia{color:var(--tinta-2);max-width:72ch}
.seccion{background:var(--hoja);border:1px solid var(--regla);border-radius:var(--radio);padding:1.1rem 1.15rem;margin-bottom:1.1rem}
.seccion > h2{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.seccion > h2 .paso{font-family:var(--mono);font-size:.8rem;color:var(--tenue);font-weight:500}
.doc-botones{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 0}
.acciones{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--regla)}
.acciones .der{display:flex;gap:.6rem;flex-wrap:wrap;margin-left:auto}
.mensajes{min-height:0}
.mensajes:not(:empty){margin-top:.75rem}
.msg{font-size:.9rem;border-radius:var(--radio);padding:.55rem .75rem;margin:.4rem 0;border:1px solid var(--regla-2);background:var(--papel)}
.msg.falta{border-color:#e0c79b;background:var(--aviso-fondo);color:var(--aviso)}
.msg ul{margin:.3rem 0 0;padding-left:1.2rem}
.coherencia:not(:empty){margin-top:.6rem}
.nota-coh{font-size:.88rem;border-left:3px solid var(--regla-2);padding:.35rem .7rem;background:var(--papel);margin:.35rem 0}

/* Portada */
.portada{max-width:820px;margin:1.5rem auto 0}
.portada .serie{font-family:var(--mono);font-size:.8rem;letter-spacing:.06em;color:var(--tenue);text-transform:uppercase}
.portada h1{font-size:2rem;margin:.3rem 0 .2rem}
.portada .sub{font-size:1.2rem;color:var(--tinta-2);margin-bottom:1.2rem}
.ficha{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:0 0 1rem;font-size:.95rem}
.ficha dt{color:var(--tenue)}
.ficha dd{margin:0}
.lista-nota{margin:.4rem 0 1rem;padding-left:1.15rem;color:var(--tinta-2);font-size:.93rem}
.continuar{border:1px solid var(--acento-3);background:var(--acento-2);border-radius:var(--radio);padding:1rem;margin-bottom:1rem}
.campo{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem;max-width:420px}
.campo label{font-weight:600}

/* Correo / documentos */
.doc{font-size:.94rem}
.doc .simulado{font-family:var(--mono);font-size:.75rem;letter-spacing:.03em;color:var(--tenue);border:1px dashed var(--regla-2);display:inline-block;padding:.15rem .45rem;border-radius:4px;margin-bottom:.6rem}
.doc h3{margin-top:.9rem}
.doc .meta{display:grid;grid-template-columns:max-content 1fr;gap:.1rem .8rem;font-size:.88rem;margin-bottom:.7rem}
.doc .meta dt{color:var(--tenue)}
.doc .meta dd{margin:0}
.doc blockquote{margin:.6rem 0;padding:.6rem .9rem;border-left:3px solid var(--regla-2);background:var(--papel)}
.doc table,.tabla{border-collapse:collapse;width:100%;font-size:.86rem;margin:.4rem 0 .8rem}
.doc th,.doc td,.tabla th,.tabla td{border:1px solid var(--regla);padding:.35rem .5rem;text-align:left;vertical-align:top}
.doc th,.tabla th{background:var(--papel-2);font-weight:600}
.doc ol,.doc ul{padding-left:1.3rem}
.tabla-scroll{overflow-x:auto;max-width:100%}

/* Logs */
.logs{display:grid;gap:.5rem}
.log{font-family:var(--mono);font-size:.82rem;background:var(--log);border:1px solid var(--regla);border-radius:var(--radio);padding:.55rem .7rem;overflow-wrap:anywhere;word-break:break-word}
.log .reg{display:block;font-family:var(--sans);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);margin-bottom:.15rem}

/* Matriz */
.matriz-wrap{width:100%}
table.matriz{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem;background:var(--hoja);border:1px solid var(--regla);border-radius:var(--radio);table-layout:fixed}
.matriz th,.matriz td{overflow-wrap:break-word;padding:.55rem .55rem;border-bottom:1px solid var(--regla);vertical-align:top;text-align:left}
.matriz thead th{background:var(--papel-2);font-size:.78rem;letter-spacing:.02em;font-weight:600;color:var(--tinta-2)}
.matriz th.col1,.matriz td.col1{width:17%}
.matriz tbody tr:last-child td{border-bottom:0}
.matriz td.futura{color:#6a7180;background:repeating-linear-gradient(135deg,#f7f6f2,#f7f6f2 6px,#f1efe9 6px,#f1efe9 12px);font-size:.78rem}
.matriz td.activa{background:#fbfcfd;box-shadow:inset 3px 0 0 var(--acento)}
.matriz .elem{font-weight:600;display:block}
.matriz .valor{font-family:var(--mono);font-size:.78rem;color:var(--tinta-2);overflow-wrap:anywhere}
.matriz .derivado{display:block;font-size:.7rem;color:var(--tenue);margin-top:.15rem}
.matriz .marca-cambio{display:inline-block;font-size:.7rem;border:1px solid var(--regla-2);border-radius:99px;padding:0 .4rem;margin-top:.25rem;color:var(--tinta-2)}
.matriz .sub{margin-top:.4rem}
.matriz select{font-size:.84rem}
.radios-clasif{margin:0}
.radios-clasif .chk{margin:.15rem 0 .3rem}
.matriz .sub-t{font-size:.75rem;color:var(--tenue);display:block;margin-bottom:.15rem}
.ayuda-btn{font:inherit;font-size:.72rem;border:1px solid var(--regla-2);background:var(--hoja);color:var(--tinta-2);border-radius:99px;width:1.5rem;height:1.5rem;padding:0;cursor:pointer;margin-left:.25rem;vertical-align:middle}
.ayuda-txt{font-weight:400;font-size:.76rem;color:var(--tinta-2);background:var(--hoja);border:1px solid var(--regla);border-radius:4px;padding:.35rem .45rem;margin-top:.35rem}
.chips{display:flex;flex-wrap:wrap;gap:.25rem}
.chip{font-size:.72rem;border:1px solid var(--regla-2);border-radius:4px;padding:.05rem .35rem;background:var(--papel)}

/* Mapa de correlación */
.mapa{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:2.5rem}
.mapa svg.lineas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mapa .col-t{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--tenue);margin:0 0 .4rem}
.fichas{display:grid;gap:.45rem}
.ficha-log{display:block;width:100%;text-align:left;font:inherit;background:var(--log);border:1px solid var(--regla);border-radius:var(--radio);padding:.5rem .65rem;cursor:pointer;min-height:44px}
.ficha-log .reg{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue)}
.ficha-log .v{font-family:var(--mono);font-size:.86rem;overflow-wrap:anywhere}
.ficha-log[aria-pressed="true"]{border-color:var(--linea);background:#e8eef3;box-shadow:inset 3px 0 0 var(--linea)}
.ficha-log .visto{font-size:.7rem;color:var(--tenue)}
.fuentes{display:grid;gap:.6rem}
.fuente{border:1px solid var(--regla);border-radius:var(--radio);background:var(--hoja);padding:.55rem .7rem}
.fuente h3{font-size:.92rem;margin:0}
.fuente .ref{font-family:var(--mono);font-size:.72rem;color:var(--tenue)}
.fuente.activa{border-color:var(--linea);box-shadow:0 0 0 2px var(--acento-3)}
.detalle{margin-top:1rem;border:1px solid var(--regla);border-radius:var(--radio);background:var(--papel);padding:.75rem .85rem}
.detalle:empty{display:none}
.detalle h3{font-size:.95rem}
.detalle .resaltada td{background:#e8eef3;font-weight:600}
.calc{display:grid;gap:.4rem;margin-top:.6rem;max-width:560px}
.calc output{display:block;font-family:var(--mono);font-size:.8rem;overflow-wrap:anywhere;background:var(--hoja);border:1px solid var(--regla);border-radius:4px;padding:.4rem .5rem;min-height:2.2rem}
.coincide{font-size:.85rem;font-weight:600}

/* Finalidad */
.panel-fin{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.panel-fin > div{border:1px solid var(--regla);border-radius:var(--radio);padding:.75rem .9rem;background:var(--papel)}
.panel-fin h3{font-size:.95rem}
.panel-fin ol,.panel-fin ul{margin:.2rem 0 .5rem;padding-left:1.2rem;font-size:.9rem}
.panel-fin table{font-size:.82rem}

/* Retención */
.ret-fila{display:grid;grid-template-columns:minmax(150px,200px) minmax(190px,250px) 1fr;gap:.9rem;align-items:start;padding:.7rem 0;border-bottom:1px solid var(--regla)}
.ret-fila:last-child{border-bottom:0}
.ret-fila.rep{grid-template-columns:minmax(120px,170px) 1fr}
.ret-fila .nom{font-weight:600;font-size:.9rem}
.ret-fila .cat{display:block;font-size:.78rem;color:var(--tenue);font-weight:400}
.ret-ctl{display:grid;gap:.35rem}
.ret-ctl label{font-size:.78rem;color:var(--tenue)}
.ret-vis{min-width:0}
.pista{position:relative;height:30px;background:var(--papel);border:1px solid var(--regla);border-radius:4px;margin-top:.2rem}
.pista .sin{position:absolute;right:0;top:0;bottom:0;width:10%;background:repeating-linear-gradient(135deg,#ece9e0,#ece9e0 4px,#f6f5f1 4px,#f6f5f1 8px);border-left:1px dashed var(--regla-2)}
.pista .barra-p{position:absolute;left:0;top:7px;height:14px;background:var(--acento);border-radius:2px}
.pista .m-base{position:absolute;top:-4px;bottom:-4px;width:0;border-left:3px solid #7b8190}
.pista .m-soc{position:absolute;top:-4px;bottom:-4px;width:0;border-left:3px dashed #8a5a12}
.escala{position:relative;height:1.1rem;font-size:.68rem;color:var(--tenue);font-family:var(--mono)}
.escala span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.escala span.fin{transform:none;right:0}
.ret-leyenda{font-size:.8rem;color:var(--tinta-2);margin-top:.35rem;display:flex;gap:.9rem;flex-wrap:wrap}
.ley-base::before{content:"";display:inline-block;width:0;height:.9em;border-left:3px solid #7b8190;margin-right:.35rem;vertical-align:-1px}
.ley-soc::before{content:"";display:inline-block;width:0;height:.9em;border-left:3px dashed #8a5a12;margin-right:.35rem;vertical-align:-1px}
.ley-sin::before{content:"";display:inline-block;width:1.2em;height:.8em;background:repeating-linear-gradient(135deg,#d9d5ca,#d9d5ca 3px,#f6f5f1 3px,#f6f5f1 6px);border:1px solid var(--regla-2);margin-right:.35rem;vertical-align:-1px}
.ley-p::before{content:"";display:inline-block;width:1.2em;height:.6em;background:var(--acento);margin-right:.35rem;vertical-align:0}

/* Contador */
.contador{font-size:.82rem;color:var(--tenue);font-family:var(--mono);margin-top:.3rem}
.contador.fuera{color:var(--aviso)}
.elementos{margin:.3rem 0 .7rem;padding-left:1.2rem;font-size:.9rem;color:var(--tinta-2)}

/* Panel de documentos */
.velo{position:fixed;inset:0;background:rgba(27,34,48,.25);z-index:30}
.panel-docs{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--hoja);border-left:1px solid var(--regla);z-index:40;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.panel-cab{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid var(--regla)}
.panel-cab h2{margin:0;font-size:1.05rem}
.panel-cab .btn{margin-left:auto}
.panel-cuerpo{overflow:auto;padding:0 1rem 1.5rem;flex:1}
.lista-docs{list-style:none;margin:.75rem 0;padding:0;display:grid;gap:.3rem}
.lista-docs button{width:100%;text-align:left;font:inherit;font-size:.9rem;background:var(--papel);border:1px solid var(--regla);border-radius:var(--radio);padding:.45rem .6rem;cursor:pointer;min-height:44px}
.lista-docs button[aria-current="true"]{border-color:var(--acento);background:var(--acento-2)}
.lista-docs .estado{font-size:.75rem;color:var(--tenue);margin-left:.4rem}
.lista-docs li.bloq{font-size:.82rem;color:var(--tenue);padding:.3rem .6rem}

/* Diálogo */
dialog.confirmar{border:1px solid var(--regla);border-radius:8px;padding:1.2rem;max-width:min(460px,92vw);color:var(--tinta)}
dialog.confirmar::backdrop{background:rgba(27,34,48,.35)}
dialog.confirmar .botones{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}

/* Reporte */
.reporte{background:var(--hoja);border:1px solid var(--regla);border-radius:var(--radio);padding:1.5rem 1.6rem;max-width:980px;margin:0 auto}
.reporte header.rep-cab{border-bottom:2px solid var(--tinta);padding-bottom:.7rem;margin-bottom:1rem}
.reporte .rep-t{font-size:1.35rem;margin:0}
.reporte .rep-s{color:var(--tinta-2);margin:.2rem 0 0;font-size:.95rem}
.reporte section{padding:.6rem 0 .9rem;border-bottom:1px solid var(--regla)}
.reporte section:last-of-type{border-bottom:0}
.reporte h2{font-size:1.05rem;margin-top:.4rem}
.reporte h2 .n{font-family:var(--mono);color:var(--tenue);font-weight:500;margin-right:.35rem}
.reporte .texto-libre{white-space:pre-wrap;background:var(--papel);border:1px solid var(--regla);border-radius:4px;padding:.6rem .75rem;font-size:.92rem}
.reporte .dim{margin:.7rem 0}
.reporte .dim h3{font-size:.95rem}
.reporte .dim ul{margin:.2rem 0;padding-left:1.2rem}
.reporte .dim li{margin:.25rem 0}
.reporte .apertura{font-size:.98rem;border-left:3px solid var(--acento);padding-left:.75rem}
.reporte .cierre{font-weight:600;margin-top:1rem;border-top:1px solid var(--regla);padding-top:.7rem}
.mapa-rep{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;font-size:.88rem}
.mapa-rep li{display:grid;grid-template-columns:minmax(0,1.1fr) 1.2rem minmax(0,1fr) 1.2rem minmax(0,1.3fr);gap:.4rem;align-items:start;border:1px solid var(--regla);border-radius:4px;padding:.35rem .5rem}
.mapa-rep .flecha{color:var(--tenue);text-align:center}
.pie-impresion{display:none}
.rep-acciones{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end;max-width:980px;margin:0 auto 1rem}

@media (max-width:900px){
  .mapa{grid-template-columns:1fr;gap:1rem}
  .mapa svg.lineas{display:none}
  .panel-fin{grid-template-columns:1fr}
}
@media (max-width:720px){
  body{font-size:15px}
  h1{font-size:1.35rem}
  .portada h1{font-size:1.55rem}
  main{padding:1rem .75rem 3rem}
  .seccion{padding:.85rem .8rem}
  .barra-in{gap:.5rem;padding:.45rem .75rem}
  .etapas li{font-size:.7rem;padding:.15rem .4rem}
  .barra-der{margin-left:0;width:100%;justify-content:space-between}
  table.matriz,table.matriz thead,table.matriz tbody,table.matriz tr,table.matriz th,table.matriz td{display:block;width:auto!important}
  table.matriz{border:0;background:transparent}
  table.matriz thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.matriz tr{background:var(--hoja);border:1px solid var(--regla);border-radius:var(--radio);margin-bottom:.75rem;overflow:hidden}
  table.matriz td{border-bottom:1px solid var(--papel-2);padding:.5rem .7rem}
  table.matriz td::before{content:attr(data-label);display:block;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;color:var(--tenue);margin-bottom:.15rem}
  table.matriz td.col1{background:var(--papel-2)}
  table.matriz td.col1::before{display:none}
  table.matriz td.futura.colapsable{padding:.3rem .7rem;font-size:.72rem}
  .ret-fila{grid-template-columns:1fr;gap:.45rem}
  .ficha{grid-template-columns:1fr}
  .ficha dt{margin-top:.3rem}
  .doc .meta{grid-template-columns:1fr}
  .panel-docs{width:100%;top:auto;height:88vh;border-left:0;border-top:1px solid var(--regla);border-radius:12px 12px 0 0}
  .reporte{padding:1rem .9rem}
  .mapa-rep li{grid-template-columns:1fr;gap:.1rem}

    if (a === 'continuar') {
      est = guardadoPrevio; guardadoPrevio = null; avisoRecuperacion = false;
      if (est.cerrado) est.etapa = 'REPORTE';
      ui.mensajes = ''; render(); return;
    }
    if (a === 'nuevo') {
      confirmar('Se borrará el expediente guardado en este navegador. ¿Continuar?', 'Borrar e iniciar').then(function (ok) {
        if (!ok) return;
        borrarGuardado(); guardadoPrevio = null; est = nuevoEstado(); ui.nombre = ''; ui.mensajes = ''; etapaPintada = null; render();
        var nm = document.getElementById('nombre'); if (nm) nm.focus();
      });
      return;
    }
    if (a === 'portada') {
      guardar(); guardadoPrevio = est; est = nuevoEstado(); ui.mensajes = '';
      etapaPintada = null; render(); return;
    }
    if (a === 'imprimir') { window.print(); return; }
    if (a === 'avanzar') { avanzar(); return; }
    if (a === 'ir') { irA(b.getAttribute('data-destino')); return; }
    if (a === 'doc') { abrirDocs(b.getAttribute('data-doc'), b); return; }
    if (a === 'ver-doc') { ui.docAbierto = b.getAttribute('data-doc'); pintarDocs(); var t = document.getElementById('doc-t'); if (t) t.focus(); return; }
    if (a === 'abrir-docs') { abrirDocs(null, b); return; }
    if (a === 'cerrar-docs') { cerrarDocs(); return; }
    if (a === 'ayuda') {
      var k = b.getAttribute('data-clave'); ui.ayuda[k] = !ui.ayuda[k];
      b.setAttribute('aria-expanded', String(ui.ayuda[k]));
      var p = document.getElementById('ayuda-' + k); if (p) p.hidden = !ui.ayuda[k];
      return;
    }
    if (a === 'ficha') {
      var id = b.getAttribute('data-ficha');
      ui.ficha = ui.ficha === id ? null : id;
      if (ui.ficha && est.correlacionesExploradas.indexOf(id) === -1) est.correlacionesExploradas.push(id);
      guardar(); render();
      var nb = document.getElementById('ficha-' + id); if (nb) nb.focus({ preventScroll: true });
      return;
    }
  }
  function alEnviar(ev) {
    var f = ev.target;
    if (f.getAttribute('data-form') !== 'inicio') return;
    ev.preventDefault();
    var nombre = (document.getElementById('nombre').value || '').trim();
    if (nombre.length < 1 || nombre.length > 60) {
      ui.mensajes = '<div class="msg falta">Escribe tu nombre (entre 1 y 60 caracteres).</div>';
      document.getElementById('mensajes').innerHTML = ui.mensajes;
      document.getElementById('nombre').focus();
      return;
    }
    est = nuevoEstado();
    est.participante = nombre; est.tInicio = Date.now();
    ui.mensajes = '';
    irA('E0');
  }
  function alTecla(ev) {
    if (ev.key === 'Escape') {
      var panel = document.getElementById('panel-docs');
      if (!panel.hidden) { ev.preventDefault(); cerrarDocs(); }
      return;
    }
    if (ev.key === 'Tab') {
      var p = document.getElementById('panel-docs');
      if (p.hidden) return;
      var foc = p.querySelectorAll('button,[href],select,input,textarea,[tabindex]:not([tabindex="-1"])');
      if (!foc.length) return;
      var primero = foc[0], ultimo = foc[foc.length - 1];
      if (!p.contains(document.activeElement)) { ev.preventDefault(); primero.focus(); return; }
      if (ev.shiftKey && document.activeElement === primero) { ev.preventDefault(); ultimo.focus(); }
      else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primero.focus(); }
    }
  }

  /* ---------- Arranque ---------- */
  function iniciar() {
    almacenamiento = probarAlmacenamiento();
    guardadoPrevio = almacenamiento ? cargar() : null;
    est = nuevoEstado();
    document.addEventListener('change', alCambiar);
    document.addEventListener('input', alEscribir);
    document.addEventListener('click', alPulsar);
    document.addEventListener('submit', alEnviar);
    document.addEventListener('keydown', alTecla);
    document.getElementById('velo').addEventListener('click', cerrarDocs);
    window.addEventListener('resize', function () { if (est.etapa === 'E2') dibujarLineas(); ajustarDesplazables(document); });
    window.addEventListener('pagehide', function () { if (temporizador) guardar(); });
    window.addEventListener('beforeunload', function () { if (temporizador) guardar(); });
    render({ sinFoco: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();

})();
</script>
